# Cloud Build config — deploys to Cloud Run on every push to main
# Used by: gcloud builds submit --config cloudbuild.yaml
# Or auto-triggered via Cloud Build triggers

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/genai-platform', '.']

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/genai-platform']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'genai-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/genai-platform'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '120'

images:
  - 'gcr.io/$PROJECT_ID/genai-platform'
